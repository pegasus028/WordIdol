<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WordIdol · EN30202 Sociolinguistics</title>
<style>
  :root { color-scheme: light dark; --ink:#1d1430; --paper:#fff7fb; --pop:#e5337a; --gold:#f2b632; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f6eef7; --paper:#170f22; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); }
  main { text-align:center; padding:2rem 1.5rem; max-width:34rem; }
  .star { font-size:3.5rem; line-height:1; }
  h1 { font-size: clamp(2.4rem, 9vw, 3.6rem); margin:.4rem 0 .2rem; letter-spacing:-.02em; }
  h1 span { color: var(--pop); }
  p { font-size:1.1rem; line-height:1.5; margin:.6rem 0; }
  .tag { display:inline-block; margin-top:1rem; padding:.35rem .9rem; border-radius:999px; border:2px solid var(--gold); font-weight:600; }
  footer { margin-top:2rem; font-size:.85rem; opacity:.7; }
</style>
</head>
<body>
<main>
  <div class="star" aria-hidden="true">🎤✨</div>
  <h1>Word<span>Idol</span></h1>
  <p>Your slang word's journey from audition to the Slang Summit stage.</p>
  <p>The app is being built. Check back soon!</p>
  <div class="tag">Opening soon</div>
  <footer>EN30202 Sociolinguistics · Make Fetch Happen · Satriwittaya School English Program · T.Chris</footer>
</main>
</body>
</html>
